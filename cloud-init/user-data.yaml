#cloud-config
hostname: {{ hostname }}
manage_etc_hosts: true

# cloud-init generates netplan config but won't activate it on boot.
# bootcmd runs on every boot and applies WiFi config.
bootcmd:
  - rfkill unblock wifi
  - netplan apply
  - |
    for i in $(seq 1 30); do
      ip -4 addr show wlan0 | grep -q 'inet ' && break
      sleep 2
    done

users:
  - name: tim
    gecos: Tim Ansell
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    groups: adm, dialout, cdrom, sudo, audio, video, plugdev, games, users, input, render, netdev, gpio, i2c, spi
    lock_passwd: true
    ssh_authorized_keys:
{% for key in ssh_keys %}
      - {{ key }}
{% endfor %}
